<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>스케치 주석과 진단</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 -apple-system, "Apple SD Gothic Neo", sans-serif; color: #1b1b1b; }
  header { padding: 8px 12px; border-bottom: 1px solid #d8d8d8; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  header .note { color: #666; }
  #layout { display: flex; height: calc(100vh - 45px); }
  #panel { width: 320px; padding: 10px 12px; overflow-y: auto; border-right: 1px solid #d8d8d8; }
  #stage { flex: 1; position: relative; background: #f4f4f4; }
  #annotation-canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  fieldset { border: 1px solid #dcdcdc; border-radius: 4px; margin: 0 0 10px; padding: 8px; }
  legend { font-weight: 600; padding: 0 4px; }
  label { display: block; margin-bottom: 6px; }
  select { width: 100%; padding: 3px; }
  button { padding: 4px 8px; margin: 0 4px 4px 0; cursor: pointer; }
  button.active { outline: 2px solid #1a63d8; }
  #message { min-height: 34px; padding: 6px; background: #fffbe6; border: 1px solid #f0e0a0; border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 2px 4px; border-bottom: 1px solid #eee; vertical-align: top; }
  .status-pass { color: #14743a; font-weight: 600; }
  .status-warn { color: #96660a; font-weight: 600; }
  .status-fail { color: #ba1b1b; font-weight: 600; }
  .status-not_scored { color: #6b6b6b; font-weight: 600; }
  ul { margin: 4px 0; padding-left: 18px; }
  li.selected { font-weight: 700; }
  .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>스케치 주석과 진단</h1>
  <span class="note">진단 전용입니다. 이미지는 수정되지 않고 주석 JSON만 저장됩니다. 총점은 만들지 않습니다.</span>
</header>

<div id="layout">
  <aside id="panel">
    <fieldset>
      <legend>대상</legend>
      <label>항목 <select id="item-select"></select></label>
      <label>판본 <select id="version-select"></select></label>
      <label>이미지 <select id="image-kind-select">
        <option value="source">컬러 원본</option>
        <option value="output">스케치 출력</option>
      </select></label>
    </fieldset>

    <fieldset>
      <legend>주석 종류</legend>
      <label><select id="annotation-type">
        <option value="connection">connection (끊긴 재단선)</option>
        <option value="required_path">required_path (필수 경계)</option>
        <option value="complete_roi">complete_roi (완전 영역)</option>
      </select></label>
    </fieldset>

    <fieldset>
      <legend>작성</legend>
      <button id="mode-pan" type="button">이동</button>
      <button id="mode-select" type="button">선택</button>
      <button id="mode-box" type="button">박스 드래그</button>
      <button id="mode-path" type="button">폴리라인 클릭</button>
      <button id="mode-anchor" type="button">앵커 두 번 클릭</button>
      <button id="finish-path" type="button">폴리라인 완료</button>
      <button id="delete-selected" type="button">선택 삭제</button>
    </fieldset>

    <fieldset>
      <legend>도우미</legend>
      <button id="import-red-boxes" type="button">빨간 박스 가져오기</button>
      <button id="suggest-anchors" type="button">앵커 자동 제안</button>
      <div id="candidate-panel" hidden>
        <p id="candidate-note"></p>
        <button id="confirm-candidates" type="button">후보 확정</button>
        <button id="discard-candidates" type="button">후보 버리기</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>보기</legend>
      <button id="zoom-in" type="button">확대</button>
      <button id="zoom-out" type="button">축소</button>
      <button id="zoom-reset" type="button">원래대로</button>
    </fieldset>

    <fieldset>
      <legend>저장과 채점</legend>
      <button id="save-annotations" type="button">주석 저장</button>
      <button id="score-output" type="button">이 이미지 채점</button>
    </fieldset>

    <div id="message">항목을 고르고 박스를 드래그해 주석을 시작하세요.</div>

    <fieldset>
      <legend>주석 목록</legend>
      <ul id="annotation-list"></ul>
    </fieldset>

    <fieldset>
      <legend>상태 범례</legend>
      <div><span class="swatch" style="background:#14743a"></span><span class="status-pass">pass</span> 연결됨 / 불변식 통과</div>
      <div><span class="swatch" style="background:#96660a"></span><span class="status-warn">warn</span> 문턱 경계</div>
      <div><span class="swatch" style="background:#ba1b1b"></span><span class="status-fail">fail</span> 끊김 / 회귀</div>
      <div><span class="swatch" style="background:#6b6b6b"></span><span class="status-not_scored">not_scored</span> 낮은 신뢰도 또는 문턱 미확정</div>
      <div><span class="swatch" style="background:#1a63d8"></span>파란 박스: 사람이 지정한 검사 영역</div>
      <div><span class="swatch" style="background:#e08a1e"></span>주황 경로: 누락 또는 추가 선</div>
    </fieldset>

    <fieldset>
      <legend>지표 (총점 없음)</legend>
      <table id="score-panel"><tbody></tbody></table>
    </fieldset>
  </aside>

  <main id="stage"><canvas id="annotation-canvas"></canvas></main>
</div>

<script>
"use strict";

const canvas = document.getElementById("annotation-canvas");
const context = canvas.getContext("2d");
const messageBox = document.getElementById("message");

const state = {
  items: {}, itemId: null, version: null, imageKind: "source",
  image: new Image(), annotations: [], selectedId: null,
  mode: "pan", draft: null, zoom: 1, panX: 0, panY: 0,
  score: null
};
state.baseScale = 1;
state.loaded = false;
state.candidates = [];
state.anchorClicks = [];
state.drag = null;

const MODES = ["pan", "select", "box", "path", "anchor"];
const COLORS = {
  box: "#1a63d8", selected: "#0b3f96", path: "#333333",
  pass: "#14743a", warn: "#96660a", fail: "#ba1b1b", not_scored: "#6b6b6b",
  problem: "#e08a1e", draft: "#8a2be2"
};

function say(text) { messageBox.textContent = text; }

/* --- geometry-contract-start (순수 함수: 테스트가 이 블록만 떼어 검사합니다) --- */
function clamp01(value) { return Math.min(1, Math.max(0, value)); }

function isInsideImage(point) {
  return Number.isFinite(point[0]) && Number.isFinite(point[1])
    && point[0] >= 0 && point[0] <= 1 && point[1] >= 0 && point[1] <= 1;
}

/* 표시된 이미지 밖의 클릭은 가장자리로 끌어붙이지 않고 아예 버립니다.
   여백 클릭이 0이나 1로 저장되면 사람이 지정하지 않은 좌표가 생깁니다. */
function acceptAnnotationPoint(point) {
  return isInsideImage(point) ? point : null;
}

/* 주석 전체(박스·앵커·폴리라인)를 감싸는 범위. 자식이 박스 밖으로 조금
   나와 있어도 이동 후 좌표가 [0,1]을 넘지 않게 하려면 박스만으로는 부족합니다. */
function annotationExtent(annotation) {
  const xs = [];
  const ys = [];
  const addBox = (box) => { xs.push(box[0], box[2]); ys.push(box[1], box[3]); };
  addBox(annotation.target_box);
  if (annotation.anchors) {
    for (const key of Object.keys(annotation.anchors)) { addBox(annotation.anchors[key]); }
  }
  if (annotation.paths) {
    for (const path of annotation.paths) {
      for (const point of path) { xs.push(point[0]); ys.push(point[1]); }
    }
  }
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
}

/* 좌표를 따로따로 자르면 가장자리에서 박스가 찌그러지고 자식이 떨어집니다.
   그래서 이동량 자체를 범위에 맞게 줄여 크기와 상대 위치를 보존합니다. */
function constrainedDelta(extent, dx, dy) {
  return [
    Math.min(Math.max(dx, -extent[0]), 1 - extent[2]),
    Math.min(Math.max(dy, -extent[1]), 1 - extent[3])
  ];
}

/* 박스가 뒤집히거나 두께 0으로 찌그러지지 않도록 최소 크기를 지킵니다. */
const MIN_BOX_SIZE = 0.005;

function enforceBoxBounds(box) {
  let [x1, y1, x2, y2] = box.map(clamp01);
  if (x2 - x1 < MIN_BOX_SIZE) {
    if (x1 + MIN_BOX_SIZE <= 1) { x2 = x1 + MIN_BOX_SIZE; }
    else { x2 = 1; x1 = 1 - MIN_BOX_SIZE; }
  }
  if (y2 - y1 < MIN_BOX_SIZE) {
    if (y1 + MIN_BOX_SIZE <= 1) { y2 = y1 + MIN_BOX_SIZE; }
    else { y2 = 1; y1 = 1 - MIN_BOX_SIZE; }
  }
  return [x1, y1, x2, y2];
}

/* 크기 조절은 target_box만 바꿉니다. 반대쪽 변을 지나치게 끌어도 변을 넘어
   뒤집지 않고 최소 크기에서 멈춥니다. 앵커·폴리라인은 건드리지 않습니다. */
function resizedBox(box, handle, point) {
  const base = enforceBoxBounds(box);
  let [x1, y1, x2, y2] = base;
  const px = clamp01(point[0]);
  const py = clamp01(point[1]);
  if (handle.includes("w")) { x1 = Math.min(px, x2 - MIN_BOX_SIZE); }
  if (handle.includes("e")) { x2 = Math.max(px, x1 + MIN_BOX_SIZE); }
  if (handle.includes("n")) { y1 = Math.min(py, y2 - MIN_BOX_SIZE); }
  if (handle.includes("s")) { y2 = Math.max(py, y1 + MIN_BOX_SIZE); }
  return enforceBoxBounds([x1, y1, x2, y2]);
}

function translateAnnotation(annotation, dx, dy) {
  const moved = JSON.parse(JSON.stringify(annotation));
  const [ddx, ddy] = constrainedDelta(annotationExtent(annotation), dx, dy);
  const shift = (box) => [box[0] + ddx, box[1] + ddy, box[2] + ddx, box[3] + ddy];
  moved.target_box = shift(annotation.target_box);
  if (annotation.anchors) {
    for (const key of Object.keys(annotation.anchors)) {
      moved.anchors[key] = shift(annotation.anchors[key]);
    }
  }
  if (annotation.paths) {
    moved.paths = annotation.paths.map((path) => path.map(([x, y]) => [x + ddx, y + ddy]));
  }
  return moved;
}
/* --- geometry-contract-end --- */

const OUTSIDE_IMAGE_MESSAGE = "이미지 밖은 주석으로 받지 않습니다. 이미지 안을 클릭하세요.";

/* 좌표 변환: 정규화 좌표는 확대·이동과 무관하게 그대로 유지합니다. */
function imageWidth() { return state.image.naturalWidth || 1; }
function imageHeight() { return state.image.naturalHeight || 1; }
function scale() { return state.baseScale * state.zoom; }

function imageToNormalized(x, y) { return [x / imageWidth(), y / imageHeight()]; }
function normalizedToImage(nx, ny) { return [nx * imageWidth(), ny * imageHeight()]; }
function imageToCanvas(x, y) { return [x * scale() + state.panX, y * scale() + state.panY]; }
function canvasToImage(x, y) { return [(x - state.panX) / scale(), (y - state.panY) / scale()]; }

function pointerPoint(event) {
  const rect = canvas.getBoundingClientRect();
  return canvasToImage(event.clientX - rect.left, event.clientY - rect.top);
}
function pointerNormalized(event) {
  const [x, y] = pointerPoint(event);
  return imageToNormalized(x, y);
}

function normalizedBox(a, b) {
  return [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[0], b[0]), Math.max(a[1], b[1])].map(clamp01);
}
function anchorSize() {
  const diagonal = Math.hypot(imageWidth(), imageHeight());
  return [0.02 * diagonal / imageWidth(), 0.02 * diagonal / imageHeight()];
}
function anchorBoxAround(point) {
  const [halfX, halfY] = anchorSize();
  return [clamp01(point[0] - halfX), clamp01(point[1] - halfY), clamp01(point[0] + halfX), clamp01(point[1] + halfY)];
}
function selected() { return state.annotations.find((a) => a.id === state.selectedId) || null; }
function metricFor(id) {
  if (!state.score || !state.score.annotations) return null;
  const entry = state.score.annotations.find((item) => item.id === id);
  return entry ? entry.metric : null;
}

function resize() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
  fitImage();
}
function fitImage() {
  if (!state.loaded) { drawOverlay(); return; }
  state.baseScale = Math.min(canvas.width / imageWidth(), canvas.height / imageHeight()) || 1;
  state.panX = (canvas.width - imageWidth() * scale()) / 2;
  state.panY = (canvas.height - imageHeight() * scale()) / 2;
  drawOverlay();
}

/* 오버레이는 canvas에만 그리고 파일로 저장하지 않습니다. */
function drawOverlay() {
  context.setTransform(1, 0, 0, 1, 0, 0);
  context.clearRect(0, 0, canvas.width, canvas.height);
  if (state.loaded) {
    context.drawImage(state.image, state.panX, state.panY, imageWidth() * scale(), imageHeight() * scale());
  }
  for (const annotation of state.annotations) {
    drawAnnotation(annotation, annotation.id === state.selectedId);
  }
  for (const box of state.candidates) { strokeBox(box, COLORS.draft, 1, true); }
  if (state.draft && state.draft.box) { strokeBox(state.draft.box, COLORS.draft, 1, true); }
  if (state.draft && state.draft.points) { strokePath(state.draft.points, COLORS.draft, true); }
}

function strokeBox(box, color, width, dashed) {
  const [x1, y1] = imageToCanvas(...normalizedToImage(box[0], box[1]));
  const [x2, y2] = imageToCanvas(...normalizedToImage(box[2], box[3]));
  context.save();
  context.strokeStyle = color;
  context.lineWidth = width || 1.5;
  context.setLineDash(dashed ? [5, 4] : []);
  context.strokeRect(x1, y1, x2 - x1, y2 - y1);
  context.restore();
  return [x1, y1, x2, y2];
}
function strokePath(points, color, dashed) {
  if (points.length === 0) return;
  context.save();
  context.strokeStyle = color;
  context.lineWidth = 2;
  context.setLineDash(dashed ? [4, 3] : []);
  context.beginPath();
  points.forEach((point, index) => {
    const [cx, cy] = imageToCanvas(...normalizedToImage(point[0], point[1]));
    if (index === 0) context.moveTo(cx, cy); else context.lineTo(cx, cy);
  });
  context.stroke();
  for (const point of points) {
    const [cx, cy] = imageToCanvas(...normalizedToImage(point[0], point[1]));
    context.fillStyle = color;
    context.fillRect(cx - 2, cy - 2, 4, 4);
  }
  context.restore();
}

function drawAnnotation(annotation, isSelected) {
  const metric = metricFor(annotation.id);
  const status = metric ? metric.status : null;
  const corners = strokeBox(annotation.target_box, isSelected ? COLORS.selected : COLORS.box, isSelected ? 2.5 : 1.5, false);
  if (isSelected) {
    const [x1, y1, x2, y2] = corners;
    context.fillStyle = COLORS.selected;
    for (const [hx, hy] of [[x1, y1], [x2, y1], [x1, y2], [x2, y2]]) {
      context.fillRect(hx - 4, hy - 4, 8, 8);
    }
  }
  if (annotation.anchors) {
    let color = COLORS.box;
    if (status === "pass") color = COLORS.pass;
    else if (status === "fail") color = COLORS.fail;
    else if (status === "not_scored") color = COLORS.not_scored;
    strokeBox(annotation.anchors.start_region, color, 2, false);
    strokeBox(annotation.anchors.end_region, color, 2, false);
  }
  if (annotation.paths) {
    let color = COLORS.path;
    if (status === "not_scored") color = COLORS.not_scored;
    if (metric && metric.details && (metric.details.detection_ratio < 1 || metric.details.extra_ratio > 0)) {
      color = COLORS.problem;
    }
    for (const path of annotation.paths) { strokePath(path, color, false); }
  }
}

function nextId(type) {
  let index = 1;
  while (state.annotations.some((a) => a.id === `${type}-${index}`)) index += 1;
  return `${type}-${index}`;
}
function newAnnotation(type, box) {
  const annotation = { id: nextId(type), type: type, target_box: box };
  if (type === "connection") annotation.anchors = {};
  else annotation.paths = [];
  return annotation;
}

function renderList() {
  const list = document.getElementById("annotation-list");
  list.innerHTML = "";
  for (const annotation of state.annotations) {
    const metric = metricFor(annotation.id);
    const item = document.createElement("li");
    if (annotation.id === state.selectedId) item.className = "selected";
    const missing = annotation.type === "connection"
      ? !(annotation.anchors && annotation.anchors.start_region && annotation.anchors.end_region)
      : !(annotation.paths && annotation.paths.length);
    item.textContent = `${annotation.id} (${annotation.type})${missing ? " · 미완성" : ""}`;
    if (metric) {
      const badge = document.createElement("span");
      badge.className = `status-${metric.status}`;
      badge.textContent = ` ${metric.status}`;
      item.appendChild(badge);
    }
    item.addEventListener("click", () => { state.selectedId = annotation.id; renderList(); drawOverlay(); });
    list.appendChild(item);
  }
}

function renderScore() {
  const body = document.querySelector("#score-panel tbody");
  body.innerHTML = "";
  if (!state.score) return;
  const rows = [];
  for (const [name, metric] of Object.entries(state.score.metrics || {})) rows.push([name, metric]);
  for (const entry of state.score.annotations || []) rows.push([`${entry.type}:${entry.id}`, entry.metric]);
  for (const [name, metric] of rows) {
    const raw = metric.details && metric.details.raw_score;
    const row = document.createElement("tr");
    row.innerHTML =
      `<th>${name}</th><td><span class="status-${metric.status}">${metric.status}</span><br>` +
      `값 ${raw === undefined || raw === null ? "-" : Number(raw).toFixed(5)}<br>` +
      `신뢰도 ${metric.confidence.toFixed(2)}${metric.reason ? `<br>사유 ${metric.reason}` : ""}</td>`;
    body.appendChild(row);
  }
}

/* 서버 통신 */
async function requestJson(url, options) {
  const response = await fetch(url, options);
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload.error || `요청 실패 (${response.status})`);
  return payload;
}

async function loadItems() {
  const payload = await requestJson("/api/images");
  state.items = {};
  const itemSelect = document.getElementById("item-select");
  itemSelect.innerHTML = "";
  for (const item of payload.items) {
    state.items[item.id] = item;
    const option = document.createElement("option");
    option.value = item.id;
    option.textContent = item.display_name + (item.needs_review ? " (확인 필요)" : "");
    itemSelect.appendChild(option);
  }
  if (payload.items.length) { itemSelect.value = payload.items[0].id; await selectItem(payload.items[0].id); }
}

async function selectItem(itemId) {
  state.itemId = itemId;
  state.score = null;
  const versionSelect = document.getElementById("version-select");
  versionSelect.innerHTML = "";
  for (const version of state.items[itemId].versions) {
    const option = document.createElement("option");
    option.value = version.version;
    option.textContent = `${version.version} (${version.kind}${version.exists ? "" : ", 파일 없음"})`;
    versionSelect.appendChild(option);
  }
  state.version = versionSelect.value || null;
  renderScore();
  await loadAnnotations();
  await loadImage();
}

function loadImage() {
  return new Promise((resolve) => {
    if (state.imageKind === "output" && !state.version) { say("이 항목에는 출력 판본이 없습니다."); resolve(); return; }
    const query = state.imageKind === "output"
      ? `kind=output&version=${encodeURIComponent(state.version)}`
      : "kind=source";
    const image = new Image();
    image.onload = () => {
      state.image = image; state.loaded = true; state.zoom = 1; fitImage(); resolve();
    };
    image.onerror = () => { state.loaded = false; say("이미지를 불러올 수 없습니다."); drawOverlay(); resolve(); };
    image.src = `/api/image/${encodeURIComponent(state.itemId)}?${query}&t=${Date.now()}`;
  });
}

async function loadAnnotations() {
  const document_ = await requestJson(`/api/annotations/${encodeURIComponent(state.itemId)}`);
  state.annotations = document_.annotations || [];
  state.selectedId = state.annotations.length ? state.annotations[0].id : null;
  state.candidates = [];
  document.getElementById("candidate-panel").hidden = true;
  renderList();
  drawOverlay();
}

async function saveAnnotations() {
  const incomplete = state.annotations.filter((a) => a.type === "connection"
    ? !(a.anchors && a.anchors.start_region && a.anchors.end_region)
    : !(a.paths && a.paths.length));
  if (incomplete.length) { say(`미완성 주석이 있습니다: ${incomplete.map((a) => a.id).join(", ")}`); return; }
  try {
    await requestJson(`/api/annotations/${encodeURIComponent(state.itemId)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ schema_version: 1, annotations: state.annotations })
    });
    say("주석을 저장했습니다. 이미지는 수정되지 않았습니다.");
  } catch (error) { say(`저장 실패: ${error.message}`); }
}

async function loadScore() {
  if (!state.version) { say("채점할 출력 판본이 없습니다."); return; }
  try {
    const payload = await requestJson(`/api/score/${encodeURIComponent(state.itemId)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ version: state.version })
    });
    state.score = payload.result;
    renderScore(); renderList(); drawOverlay();
    say("지표별 결과를 표시했습니다. 총점은 만들지 않습니다.");
  } catch (error) { say(`채점 실패: ${error.message}`); }
}

async function importRedBoxes() {
  try {
    const payload = await requestJson(`/api/import-red-boxes/${encodeURIComponent(state.itemId)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kind: "output", version: state.version })
    });
    state.candidates = payload.candidates || [];
    const panel = document.getElementById("candidate-panel");
    panel.hidden = state.candidates.length === 0;
    document.getElementById("candidate-note").textContent =
      `${state.candidates.length}개 후보를 찾았습니다. 확정하면 주석이 되며 저장은 따로 눌러야 합니다.`;
    say(state.candidates.length ? "후보를 확인하고 확정하세요." : "빨간 박스 후보를 찾지 못했습니다.");
    drawOverlay();
  } catch (error) { say(`가져오기 실패: ${error.message}`); }
}

async function suggestAnchors() {
  const annotation = selected();
  if (!annotation || annotation.type !== "connection") { say("connection 주석을 먼저 선택하세요."); return; }
  try {
    const payload = await requestJson(`/api/suggest-anchors/${encodeURIComponent(state.itemId)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kind: "output", version: state.version, target_box: annotation.target_box })
    });
    const anchors = payload.anchors || [];
    if (anchors.length === 2) {
      annotation.anchors = { start_region: anchors[0], end_region: anchors[1] };
      say("앵커 두 개를 제안대로 채웠습니다. 확인하고 저장하세요.");
    } else {
      say(payload.reason
        || "후보가 정확히 두 개가 아닙니다. 앵커 모드에서 끊긴 두 끝을 순서대로 클릭하세요.");
    }
    renderList(); drawOverlay();
  } catch (error) { say(`제안 실패: ${error.message}`); }
}

/* 포인터 조작 */
function hitTest(point) {
  for (let index = state.annotations.length - 1; index >= 0; index -= 1) {
    const box = state.annotations[index].target_box;
    if (point[0] >= box[0] && point[0] <= box[2] && point[1] >= box[1] && point[1] <= box[3]) {
      return state.annotations[index];
    }
  }
  return null;
}
function handleAt(annotation, point) {
  if (!annotation) return null;
  const box = annotation.target_box;
  const tolerance = 8 / scale();
  const [tx, ty] = [tolerance / imageWidth(), tolerance / imageHeight()];
  const corners = { nw: [box[0], box[1]], ne: [box[2], box[1]], sw: [box[0], box[3]], se: [box[2], box[3]] };
  for (const [name, corner] of Object.entries(corners)) {
    if (Math.abs(point[0] - corner[0]) <= tx && Math.abs(point[1] - corner[1]) <= ty) return name;
  }
  return null;
}


canvas.addEventListener("pointerdown", (event) => {
  canvas.setPointerCapture(event.pointerId);
  const point = pointerNormalized(event);
  if (state.mode === "pan") {
    state.drag = { kind: "pan", x: event.clientX, y: event.clientY };
  } else if (state.mode === "box") {
    const start = acceptAnnotationPoint(point);
    if (!start) { say(OUTSIDE_IMAGE_MESSAGE); return; }
    state.draft = { start: start, box: normalizedBox(start, start) };
  } else if (state.mode === "select") {
    const target = hitTest(point);
    state.selectedId = target ? target.id : null;
    const handle = handleAt(target, point);
    state.drag = target
      ? {
          kind: handle ? "resize" : "move",
          handle: handle,
          point: point,
          origin: point,
          snapshot: JSON.parse(JSON.stringify(target)),
          id: target.id
        }
      : null;
    renderList();
  }
  drawOverlay();
});

canvas.addEventListener("pointermove", (event) => {
  if (state.draft && state.draft.start && state.mode === "box") {
    state.draft.box = normalizedBox(state.draft.start, pointerNormalized(event));
    drawOverlay();
    return;
  }
  if (!state.drag) return;
  if (state.drag.kind === "pan") {
    state.panX += event.clientX - state.drag.x;
    state.panY += event.clientY - state.drag.y;
    state.drag.x = event.clientX; state.drag.y = event.clientY;
    drawOverlay();
    return;
  }
  const annotation = state.annotations.find((a) => a.id === state.drag.id);
  if (!annotation) return;
  const point = pointerNormalized(event);
  if (state.drag.kind === "move") {
    // 누적 이동량을 원본에 적용해 경계에서 잘려도 좌표가 밀리지 않게 합니다.
    Object.assign(annotation, translateAnnotation(
      state.drag.snapshot,
      point[0] - state.drag.origin[0],
      point[1] - state.drag.origin[1]
    ));
  } else {
    // 원본 박스에서 다시 계산해 경계에서 밀리지 않게 합니다. 크기 조절은
    // target_box만 바꾸고 앵커·폴리라인은 그대로 둡니다.
    annotation.target_box = resizedBox(
      state.drag.snapshot.target_box, state.drag.handle, point
    );
  }
  drawOverlay();
});

canvas.addEventListener("pointerup", (event) => {
  if (state.mode === "box" && state.draft && state.draft.start) {
    const end = acceptAnnotationPoint(pointerNormalized(event));
    const box = end ? normalizedBox(state.draft.start, end) : null;
    state.draft = null;
    if (!end) {
      say(OUTSIDE_IMAGE_MESSAGE);
    } else if (box[2] - box[0] > 0.002 && box[3] - box[1] > 0.002) {
      const annotation = newAnnotation(document.getElementById("annotation-type").value, box);
      state.annotations.push(annotation);
      state.selectedId = annotation.id;
      say(annotation.type === "connection"
        ? "앵커 모드로 끊긴 두 끝을 클릭하거나 자동 제안을 쓰세요."
        : "폴리라인 모드로 경계를 클릭하고 완료를 누르세요.");
      renderList();
    }
  }
  state.drag = null;
  drawOverlay();
});

canvas.addEventListener("click", (event) => {
  if (state.mode !== "path" && state.mode !== "anchor") return;
  const point = acceptAnnotationPoint(pointerNormalized(event));
  if (!point) { say(OUTSIDE_IMAGE_MESSAGE); return; }
  const annotation = selected();
  if (state.mode === "path") {
    if (!annotation || annotation.type === "connection") { say("폴리라인은 required_path 또는 complete_roi에만 넣습니다."); return; }
    if (!state.draft || !state.draft.points) state.draft = { points: [] };
    state.draft.points.push(point);
    drawOverlay();
  } else if (state.mode === "anchor") {
    if (!annotation || annotation.type !== "connection") { say("connection 주석을 먼저 선택하세요."); return; }
    state.anchorClicks.push(point);
    if (state.anchorClicks.length === 2) {
      annotation.anchors = {
        start_region: anchorBoxAround(state.anchorClicks[0]),
        end_region: anchorBoxAround(state.anchorClicks[1])
      };
      state.anchorClicks = [];
      say("앵커 두 개를 만들었습니다.");
      renderList();
    } else {
      say("끊긴 선의 반대쪽 끝을 클릭하세요.");
    }
    drawOverlay();
  }
});

canvas.addEventListener("dblclick", () => finishPath());
canvas.addEventListener("wheel", (event) => {
  event.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const before = canvasToImage(event.clientX - rect.left, event.clientY - rect.top);
  state.zoom = Math.min(12, Math.max(0.2, state.zoom * (event.deltaY < 0 ? 1.1 : 1 / 1.1)));
  const after = canvasToImage(event.clientX - rect.left, event.clientY - rect.top);
  state.panX += (after[0] - before[0]) * scale();
  state.panY += (after[1] - before[1]) * scale();
  drawOverlay();
}, { passive: false });

function finishPath() {
  const annotation = selected();
  if (!annotation || !state.draft || !state.draft.points) return;
  if (state.draft.points.length < 2) { say("폴리라인은 점이 두 개 이상이어야 합니다."); return; }
  annotation.paths = (annotation.paths || []).concat([state.draft.points]);
  state.draft = null;
  say("폴리라인을 추가했습니다.");
  renderList();
  drawOverlay();
}

function deleteSelected() {
  if (!state.selectedId) return;
  state.annotations = state.annotations.filter((a) => a.id !== state.selectedId);
  state.selectedId = null;
  state.draft = null;
  renderList();
  drawOverlay();
  say("선택한 주석을 지웠습니다. 저장을 눌러야 파일에 반영됩니다.");
}

function setMode(mode) {
  state.mode = mode;
  state.draft = null;
  state.anchorClicks = [];
  for (const name of MODES) {
    document.getElementById(`mode-${name}`).classList.toggle("active", name === mode);
  }
  drawOverlay();
}

function zoomBy(factor) {
  const centerBefore = canvasToImage(canvas.width / 2, canvas.height / 2);
  state.zoom = Math.min(12, Math.max(0.2, state.zoom * factor));
  const centerAfter = canvasToImage(canvas.width / 2, canvas.height / 2);
  state.panX += (centerAfter[0] - centerBefore[0]) * scale();
  state.panY += (centerAfter[1] - centerBefore[1]) * scale();
  drawOverlay();
}

for (const name of MODES) {
  document.getElementById(`mode-${name}`).addEventListener("click", () => setMode(name));
}
document.getElementById("finish-path").addEventListener("click", finishPath);
document.getElementById("delete-selected").addEventListener("click", deleteSelected);
document.getElementById("save-annotations").addEventListener("click", saveAnnotations);
document.getElementById("score-output").addEventListener("click", loadScore);
document.getElementById("import-red-boxes").addEventListener("click", importRedBoxes);
document.getElementById("suggest-anchors").addEventListener("click", suggestAnchors);
document.getElementById("zoom-in").addEventListener("click", () => zoomBy(1.25));
document.getElementById("zoom-out").addEventListener("click", () => zoomBy(1 / 1.25));
document.getElementById("zoom-reset").addEventListener("click", () => { state.zoom = 1; fitImage(); });

document.getElementById("confirm-candidates").addEventListener("click", () => {
  const type = document.getElementById("annotation-type").value;
  for (const box of state.candidates) {
    const annotation = newAnnotation(type, box);
    state.annotations.push(annotation);
    state.selectedId = annotation.id;
  }
  state.candidates = [];
  document.getElementById("candidate-panel").hidden = true;
  say("후보를 주석으로 확정했습니다. 저장을 눌러야 파일에 반영됩니다.");
  renderList();
  drawOverlay();
});
document.getElementById("discard-candidates").addEventListener("click", () => {
  state.candidates = [];
  document.getElementById("candidate-panel").hidden = true;
  drawOverlay();
});

document.getElementById("item-select").addEventListener("change", (event) => selectItem(event.target.value));
document.getElementById("version-select").addEventListener("change", async (event) => {
  state.version = event.target.value;
  state.score = null;
  renderScore();
  if (state.imageKind === "output") await loadImage(); else drawOverlay();
});
document.getElementById("image-kind-select").addEventListener("change", async (event) => {
  state.imageKind = event.target.value;
  await loadImage();
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Enter") finishPath();
  if ((event.key === "Delete" || event.key === "Backspace") && event.target === document.body) deleteSelected();
});
window.addEventListener("resize", resize);

setMode("pan");
resize();
loadItems().catch((error) => say(`목록을 불러오지 못했습니다: ${error.message}`));
</script>
</body>
</html>
